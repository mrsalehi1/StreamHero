<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamHero — Live Ingest Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
</head>
<body>
  <header>
    <h1>Stream<span class="accent">Hero</span></h1>
    <p class="tagline">RTMP ingest hub — publish a stream, watch it here live.</p>
  </header>

  <section class="endpoint-banner">
    <div>
      <span class="label">Your ingest endpoint</span>
      <code id="ingest-url">rtmp://localhost:1935/live/&lt;stream-key&gt;</code>
    </div>
    <button id="copy-btn" title="Copy ingest URL">Copy</button>
  </section>

  <main>
    <div class="grid-header">
      <h2>Live inputs</h2>
      <span id="stream-count" class="count">0 streams</span>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty">
      <p>No streams yet.</p>
      <p class="hint">Point your encoder at the RTMP endpoint and it will appear here.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
